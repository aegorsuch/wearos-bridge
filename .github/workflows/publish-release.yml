name: Publish release

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      WEAROS_BRIDGE_HOME: ${{ runner.temp }}/wearos-bridge-state
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'wearos-bridge.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Output $_.Message }
            throw 'PowerShell syntax validation failed.'
          }

      - name: Validate launcher
        if: runner.os != 'Windows'
        run: sh -n wearos-bridge.sh

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run tests (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

      # The Windows .bat launcher runs Windows PowerShell 5.1, so test it too.
      - name: Run tests (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester -Path ./tests -CI

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package release archives
        id: package
        run: |
          out="$RUNNER_TEMP/dist"
          mkdir -p "$out" "$RUNNER_TEMP/stage"

          win="$RUNNER_TEMP/stage/wearos-bridge-windows"
          mkdir -p "$win"
          cp README.md wearos-bridge.bat wearos-bridge.ps1 "$win/"
          (cd "$RUNNER_TEMP/stage" && zip -qr "$out/wearos-bridge-windows.zip" wearos-bridge-windows)

          for platform in macos linux; do
            dir="$RUNNER_TEMP/stage/wearos-bridge-$platform"
            mkdir -p "$dir"
            cp README.md wearos-bridge.sh wearos-bridge.ps1 "$dir/"
            chmod +x "$dir/wearos-bridge.sh"
            tar -C "$RUNNER_TEMP/stage" -czf "$out/wearos-bridge-$platform.tar.gz" "wearos-bridge-$platform"
          done

          short_sha="${GITHUB_SHA:0:12}"
          echo "dist=$out" >> "$GITHUB_OUTPUT"
          echo "tag=build-$short_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: WearOS Bridge ${{ steps.package.outputs.short_sha }}
          body: |
            Automated package from commit ${{ github.sha }}.

            Downloads: `wearos-bridge-windows.zip`, `wearos-bridge-macos.tar.gz`, `wearos-bridge-linux.tar.gz`.
            Automated tests run on Windows, Ubuntu, and macOS runners with fixture ADB; no physical watch is used in CI.
          files: |
            ${{ steps.package.outputs.dist }}/wearos-bridge-windows.zip
            ${{ steps.package.outputs.dist }}/wearos-bridge-macos.tar.gz
            ${{ steps.package.outputs.dist }}/wearos-bridge-linux.tar.gz
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}